<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="s24BodyViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="s24FrameViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="s24ShadowViolet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3b0764" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#s24ShadowViolet)">
    <!-- Titanium Yellow/Goldish frame with Violet back -->
    <rect x="90" y="28" width="220" height="434" rx="14" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <!-- Back Matte Violet Glass -->
    <rect x="93" y="31" width="214" height="428" rx="12" fill="url(#s24BodyViolet)" />
  </g>

  <!-- Left Camera Column (3 lenses) -->
  <!-- Top: Ultra Wide -->
  <circle cx="130" cy="72" r="16" fill="#581c87" stroke="#fbbf24" stroke-width="2" />
  <circle cx="130" cy="72" r="12" fill="#1e1b4b" />
  <circle cx="127" cy="69" r="4" fill="#c084fc" opacity="0.5" />

  <!-- Middle: Main 200MP -->
  <circle cx="130" cy="116" r="16" fill="#581c87" stroke="#fbbf24" stroke-width="2" />
  <circle cx="130" cy="116" r="12" fill="#1e1b4b" />
  <circle cx="127" cy="113" r="4" fill="#c084fc" opacity="0.5" />

  <!-- Bottom: 50MP Periscope -->
  <circle cx="130" cy="160" r="16" fill="#581c87" stroke="#fbbf24" stroke-width="2" />
  <circle cx="130" cy="160" r="12" fill="#1e1b4b" />
  <rect x="124" y="154" width="12" height="12" rx="2" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />

  <!-- Right Mini Column: Laser AF, Flash, Telephoto -->
  <circle cx="166" cy="72" r="8" fill="#581c87" stroke="#fbbf24" stroke-width="1.5" />
  <circle cx="166" cy="72" r="4" fill="#ef4444" opacity="0.8" />

  <circle cx="166" cy="102" r="6" fill="#fef08a" stroke="#eab308" stroke-width="1" />

  <circle cx="166" cy="132" r="12" fill="#581c87" stroke="#fbbf24" stroke-width="2" />
  <circle cx="166" cy="132" r="8" fill="#1e1b4b" />

  <!-- Samsung Subtle Logo -->
  <text x="200" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#a855f7">SAMSUNG</text>

  <!-- Variant Pill Badge -->
  <rect x="130" y="420" width="140" height="24" rx="12" fill="#3b0764" stroke="#a855f7" />
  <text x="200" y="436" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">TITANIUM VIOLET</text>
</svg>
