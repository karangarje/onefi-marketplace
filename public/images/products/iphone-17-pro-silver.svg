<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>
  
  <!-- Shadow & Phone Body -->
  <g filter="url(#shadow)">
    <!-- Outer Frame (Titanium) -->
    <rect x="95" y="30" width="210" height="430" rx="42" fill="url(#frameGrad)" />
    <!-- Back Matte Glass -->
    <rect x="98" y="33" width="204" height="424" rx="39" fill="url(#bodyGrad)" />
  </g>

  <!-- Antenna bands -->
  <line x1="95" y1="80" x2="98" y2="80" stroke="#94a3b8" stroke-width="3" />
  <line x1="302" y1="80" x2="305" y2="80" stroke="#94a3b8" stroke-width="3" />
  <line x1="95" y1="410" x2="98" y2="410" stroke="#94a3b8" stroke-width="3" />
  <line x1="302" y1="410" x2="305" y2="410" stroke="#94a3b8" stroke-width="3" />

  <!-- Camera Bump Island -->
  <rect x="110" y="48" width="94" height="100" rx="26" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Lens -->
  <circle cx="140" cy="78" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <circle cx="140" cy="78" r="14" fill="url(#lensGrad)" />
  <circle cx="137" cy="75" r="5" fill="#38bdf8" opacity="0.4" />

  <!-- Bottom Lens -->
  <circle cx="140" cy="120" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <circle cx="140" cy="120" r="14" fill="url(#lensGrad)" />
  <circle cx="137" cy="117" r="5" fill="#38bdf8" opacity="0.4" />

  <!-- Right Lens -->
  <circle cx="180" cy="99" r="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <circle cx="180" cy="99" r="14" fill="url(#lensGrad)" />
  <circle cx="177" cy="96" r="5" fill="#38bdf8" opacity="0.4" />

  <!-- Flash & LiDAR -->
  <circle cx="180" cy="65" r="5" fill="#fef08a" stroke="#fde047" stroke-width="1.5" />
  <circle cx="180" cy="132" r="4" fill="#0f172a" />

  <!-- Subtle Apple Logo Silhouette -->
  <path d="M198 238 c-4-5-4-12 0-16 4-5 12-4 15 0-3 5-3 12 0 16 -3 4-11 4-15 0 z M204 220 c2-3 2-6 0-8 -3 1-5 4-4 8 2 0 4 0 4 0 z" fill="#94a3b8" opacity="0.6" transform="scale(1.3) translate(-57, -68)" />

  <!-- Variant Pill Badge -->
  <rect x="135" y="420" width="130" height="24" rx="12" fill="#ffffff" opacity="0.9" />
  <text x="200" y="436" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569">SILVER TITANIUM</text>
</svg>
