<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="frameGradBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lensGradBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="shadowBlack" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Shadow & Phone Body -->
  <g filter="url(#shadowBlack)">
    <!-- Outer Frame (Black Titanium) -->
    <rect x="95" y="30" width="210" height="430" rx="42" fill="url(#frameGradBlack)" />
    <!-- Back Matte Glass -->
    <rect x="98" y="33" width="204" height="424" rx="39" fill="url(#bodyGradBlack)" />
  </g>

  <!-- Antenna bands -->
  <line x1="95" y1="80" x2="98" y2="80" stroke="#334155" stroke-width="3" />
  <line x1="302" y1="80" x2="305" y2="80" stroke="#334155" stroke-width="3" />
  <line x1="95" y1="410" x2="98" y2="410" stroke="#334155" stroke-width="3" />
  <line x1="302" y1="410" x2="305" y2="410" stroke="#334155" stroke-width="3" />

  <!-- Camera Bump Island -->
  <rect x="110" y="48" width="94" height="100" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Top Lens -->
  <circle cx="140" cy="78" r="18" fill="#334155" stroke="#475569" stroke-width="2" />
  <circle cx="140" cy="78" r="14" fill="url(#lensGradBlack)" />
  <circle cx="137" cy="75" r="5" fill="#38bdf8" opacity="0.3" />

  <!-- Bottom Lens -->
  <circle cx="140" cy="120" r="18" fill="#334155" stroke="#475569" stroke-width="2" />
  <circle cx="140" cy="120" r="14" fill="url(#lensGradBlack)" />
  <circle cx="137" cy="117" r="5" fill="#38bdf8" opacity="0.3" />

  <!-- Right Lens -->
  <circle cx="180" cy="99" r="18" fill="#334155" stroke="#475569" stroke-width="2" />
  <circle cx="180" cy="99" r="14" fill="url(#lensGradBlack)" />
  <circle cx="177" cy="96" r="5" fill="#38bdf8" opacity="0.3" />

  <!-- Flash & LiDAR -->
  <circle cx="180" cy="65" r="5" fill="#fef08a" stroke="#fde047" stroke-width="1.5" />
  <circle cx="180" cy="132" r="4" fill="#020617" />

  <!-- Subtle Apple Logo Silhouette -->
  <path d="M198 238 c-4-5-4-12 0-16 4-5 12-4 15 0-3 5-3 12 0 16 -3 4-11 4-15 0 z M204 220 c2-3 2-6 0-8 -3 1-5 4-4 8 2 0 4 0 4 0 z" fill="#475569" opacity="0.7" transform="scale(1.3) translate(-57, -68)" />

  <!-- Variant Pill Badge -->
  <rect x="135" y="420" width="130" height="24" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="200" y="436" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">BLACK TITANIUM</text>
</svg>
