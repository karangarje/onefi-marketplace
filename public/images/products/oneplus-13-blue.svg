<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="op13BodyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="op13FrameBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="op13ShadowBlue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0c4a6e" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#op13ShadowBlue)">
    <!-- Curvier Flagship Frame -->
    <rect x="94" y="28" width="212" height="434" rx="36" fill="url(#op13FrameBlue)" />
    <!-- Back Matte Ocean Blue Glass -->
    <rect x="97" y="31" width="206" height="428" rx="33" fill="url(#op13BodyBlue)" />
  </g>

  <!-- Iconic Circular Camera Island -->
  <circle cx="160" cy="115" r="50" fill="#075985" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="160" cy="115" r="46" fill="#0369a1" />

  <!-- Hasselblad 'H' Logo snippet -->
  <text x="160" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#bae6fd">H</text>

  <!-- Quad Camera Module within the circle -->
  <!-- Top Left -->
  <circle cx="140" cy="95" r="12" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" />
  <circle cx="140" cy="95" r="8" fill="#020617" />
  <circle cx="138" cy="93" r="3" fill="#38bdf8" opacity="0.6" />

  <!-- Top Right -->
  <circle cx="180" cy="95" r="12" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" />
  <circle cx="180" cy="95" r="8" fill="#020617" />
  <circle cx="178" cy="93" r="3" fill="#38bdf8" opacity="0.6" />

  <!-- Bottom Left -->
  <circle cx="140" cy="135" r="12" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" />
  <circle cx="140" cy="135" r="8" fill="#020617" />
  <circle cx="138" cy="133" r="3" fill="#38bdf8" opacity="0.6" />

  <!-- Bottom Right Flash -->
  <circle cx="180" cy="135" r="10" fill="#fef08a" stroke="#eab308" stroke-width="1" />
  <circle cx="180" cy="135" r="5" fill="#fef9c3" />

  <!-- OnePlus 1+ Logo Badge -->
  <rect x="188" y="240" width="24" height="24" rx="4" fill="none" stroke="#ffffff" stroke-width="2" />
  <text x="200" y="257" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff">1+</text>

  <!-- Variant Pill Badge -->
  <rect x="135" y="420" width="130" height="24" rx="12" fill="#075985" stroke="#38bdf8" />
  <text x="200" y="436" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f0f9ff">ARCTIC BLUE</text>
</svg>
